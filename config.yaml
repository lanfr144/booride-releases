# Configuration per environment.
# No secret is written here: DB_URL and API_KEY are read from the .env file
# (or from real environment variables). ${NAME} is replaced by the loader.
# This file can be committed; .env cannot.
environments:
  dev:
    DB_URL: "${DEV_DB_URL}"
    API_KEY: "${DEV_API_KEY}"
    DEBUG: true
  staging:
    DB_URL: "${STAGING_DB_URL}"
    API_KEY: "${STAGING_API_KEY}"
    DEBUG: true
  prod:
    DB_URL: "${PROD_DB_URL}"
    API_KEY: "${PROD_API_KEY}"
    DEBUG: false
